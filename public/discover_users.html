<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Users - OurShow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .user-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid var(--glass-border);
            transition: background 0.2s;
        }

        .user-card:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-color);
        }

        .follow-btn {
            margin-left: auto;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">OurShow</a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="margin-top: 6rem; max-width: 800px;">
        <h1 class="section-title">Find Friends</h1>
        <input type="text" class="glass-input" placeholder="Search users..." style="margin-bottom: 2rem;">

        <div class="glass-panel">
            <div class="user-card">
                <img src="https://ui-avatars.com/api/?name=Alice+Smith" class="user-avatar" alt="Alice">
                <div>
                    <div style="font-weight: 600;">Alice Smith</div>
                    <div style="font-size: 0.8rem; color: var(--text-secondary);">@alice_s • 98% Compatibility</div>
                </div>
                <button class="glass-button follow-btn">Follow</button>
            </div>
            <div class="user-card">
                <img src="https://ui-avatars.com/api/?name=Bob+Jones" class="user-avatar" alt="Bob">
                <div>
                    <div style="font-weight: 600;">Bob Jones</div>
                    <div style="font-size: 0.8rem; color: var(--text-secondary);">@bobby_j • 45% Compatibility</div>
                </div>
                <button class="glass-button follow-btn">Follow</button>
            </div>
            <div class="user-card">
                <img src="https://ui-avatars.com/api/?name=Charlie+Day" class="user-avatar" alt="Charlie">
                <div>
                    <div style="font-weight: 600;">Charlie Day</div>
                    <div style="font-size: 0.8rem; color: var(--text-secondary);">@charlie • 80% Compatibility</div>
                </div>
                <button class="glass-button follow-btn">Follow</button>
            </div>
        </div>
    </div>

</body>

</html>
