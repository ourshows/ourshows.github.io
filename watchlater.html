<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Later - OurShow</title>
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="public/modal.css">
    <link rel="stylesheet" href="themes.css">
    <style>
        /* Info Loader Styles (Critical Path) */
        #globalLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.5s ease-out, visibility 0.5s;
            overflow: hidden;
        }

        #globalLoader::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vmax;
            height: 150vmax;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.08) 0%, transparent 60%);
            animation: pulseGradient 8s ease-in-out infinite;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .loader-text-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            position: relative;
            z-index: 10;
        }

        .loader-brand {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #7c3aed, #a855f7, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            opacity: 0;
            animation: loaderFadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            letter-spacing: -2px;
            margin-bottom: 0.5rem;
        }

        .loader-tags {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .loader-tag {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            color: #94a3b8;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0;
            animation: loaderFadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes loaderFadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes pulseGradient {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0.8;
            }
        }

        @media (max-width: 480px) {
            .loader-brand {
                font-size: 3rem;
                letter-spacing: -1px;
            }

            .loader-tags {
                flex-direction: column;
                gap: 0.8rem;
            }

            .loader-tag {
                font-size: 1rem;
                letter-spacing: 2px;
            }
        }
    </style>
    <script>
        window.ourShowLoader = {
            show: function () {
                const l = document.getElementById('globalLoader');
                if (l) { l.style.opacity = '1'; l.style.visibility = 'visible'; }
            },
            hide: function () {
                const l = document.getElementById('globalLoader');
                if (l) {
                    l.style.opacity = '0';
                    setTimeout(() => l.style.visibility = 'hidden', 500);
                }
            }
        };
        setTimeout(() => {
            const l = document.getElementById('globalLoader');
            if (l && getComputedStyle(l).visibility !== 'hidden' && getComputedStyle(l).opacity !== '0') {
                console.warn("Loader safety timeout");
                window.ourShowLoader.hide();
            }
        }, 8000);
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="globalLoader">
        <div class="loader-text-container">
            <div class="loader-brand">OurShow</div>
            <div class="loader-tags">
                <span class="loader-tag" style="animation-delay: 0.2s;">Discover</span>
                <span class="loader-tag" style="animation-delay: 0.4s;">Discuss</span>
                <span class="loader-tag" style="animation-delay: 0.6s;">Recommend</span>
            </div>
        </div>
    </div>

    <nav class="navbar" id="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">OurShow</a>

            <div class="nav-right" id="navRight">
                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="discover.html" class="nav-link"><i class="fas fa-compass"></i> Discover</a></li>
                    <li><a href="collection.html" class="nav-link"><i class="fas fa-bookmark"></i> Collections</a></li>
                    <li><a href="watchedlist.html" class="nav-link active"><i class="fas fa-list"></i> Watchlist</a>
                    </li>
                    <li><a href="communitychat.html" class="nav-link"><i class="fas fa-comments"></i> Chat</a></li>

                    <li><a href="ai.html" class="nav-link"><i class="fas fa-robot"></i> AI Assistant</a></li>
                </ul>

                <div class="nav-actions">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Search..." id="searchInput">
                        <div class="search-results" id="searchResults"></div>
                    </div>

                    <button class="icon-btn theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                        <i class="fas fa-moon"></i>
                    </button>

                    <a href="login.html" class="auth-btn" id="navAuthBtn">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </a>
                </div>
            </div>

            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <div class="container" style="margin-top: 7rem; min-height: 80vh;">
        <div
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
            <h1 class="section-title" style="margin-bottom: 0;">Watch Later</h1>
            <div style="display: flex; gap: 1rem;">
                <a href="watchedlist.html" class="glass-button blue"><i class="fas fa-check-circle"></i> Watched
                    History</a>
                <a href="stats.html" class="glass-button blue"><i class="fas fa-chart-pie"></i> Stats</a>
            </div>
        </div>

        <!-- Filters -->
        <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
            <button class="glass-button active" id="filterAll" onclick="filterItems('all')">All</button>
            <button class="glass-button" id="filterMovies" onclick="filterItems('movie')">Movies</button>
            <button class="glass-button" id="filterSeries" onclick="filterItems('tv')">Series</button>
        </div>

        <div id="loading" style="text-align: center; padding: 2rem; display: none;">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
        </div>

        <div id="watchLaterContainer" class="media-scroller"
            style="flex-wrap: wrap; overflow: visible; gap: 1.5rem; justify-content: flex-start;">
            <!-- Dynamic Content -->
        </div>

        <div id="emptyState" style="text-align: center; padding: 4rem; display: none; color: var(--text-secondary);">
            <i class="fas fa-bookmark fa-3x" style="margin-bottom: 1rem; opacity: 0.5;"></i>
            <h3>Your list is empty</h3>
            <p>Save movies and shows here to watch them later.</p>
            <a href="index.html" class="glass-button primary" style="margin-top: 1rem; display: inline-block;">Browse
                Content</a>
        </div>
    </div>

    <!-- Movie Details Modal -->
    <div id="movieModal" class="modal" style="display: none;">
        <div class="modal-content glass-panel">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-body">
                <div class="modal-poster-container">
                    <img id="modalPoster" src="" alt="Movie Poster" class="modal-poster">
                </div>
                <div class="modal-info">
                    <h2 id="modalTitle" style="margin-bottom: 1rem;">Movie Title</h2>
                    <div style="display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
                        <span style="color: #ffd700;">★ <span id="modalRating">N/A</span></span>
                        <span id="modalYear">Year</span>
                    </div>
                    <p id="modalOverview" class="modal-overview">Overview text...</p>

                    <div class="modal-actions">
                        <button class="glass-button primary" onclick="watchNow()"><i class="fas fa-play"></i> Watch
                            Now</button>
                        <button class="glass-button" onclick="moveToWatched()"><i class="fas fa-check"></i> Mark
                            Watched</button>
                        <button class="glass-button danger" onclick="removeFromWatchLater()"><i
                                class="fas fa-trash"></i> Remove</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script type="module" src="watchlater.js"></script>
    <script src="auth.js"></script>
    <script src="public/mobile-nav.js"></script>
</body>

</html>
