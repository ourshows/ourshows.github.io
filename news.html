<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie News - OurShow</title>
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="themes.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" href="public/logo.jpg">
    <link rel="apple-touch-icon" href="public/logo.jpg">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .news-container {
            max-width: 1200px;
            margin: 6rem auto 2rem;
            padding: 0 1.5rem;
        }

        .news-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .news-header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* --- Tabs --- */
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 0.8rem 2rem;
            border-radius: 99px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }

        /* --- Sections View Management --- */
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- Section Styling --- */
        .section-header {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-header h2 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .section-controls {
            display: flex;
            gap: 10px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 0.5rem 1.2rem;
            border-radius: 99px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .chip:hover,
        .chip.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* News Grid */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .news-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .news-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #1e293b;
        }

        .news-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .news-source {
            font-size: 0.8rem;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .news-date {
            color: var(--text-secondary);
            font-weight: 400;
        }

        .news-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        .read-more-btn {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            padding: 0.8rem;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s;
            margin-top: auto;
        }

        .read-more-btn:hover {
            background: var(--primary-color);
        }

        /* Coming Soon Layout (Grid instead of Scroller for dedicated page) */
        .coming-soon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2rem;
        }

        .upcoming-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .upcoming-card:hover {
            transform: translateY(-5px);
        }

        .upcoming-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
        }

        .release-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff6b6b;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .upcoming-date {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }

        .search-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .search-container input {
            flex: 1;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: white;
            outline: none;
        }

        .search-container button {
            padding: 0 1.5rem;
            border-radius: 12px;
            background: var(--primary-color);
            border: none;
            color: white;
            cursor: pointer;
        }

        .loader-container {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        @media (max-width: 600px) {
            .tabs-container {
                gap: 0.5rem;
            }

            .tab-btn {
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
            }

            .news-header h1 {
                font-size: 2.2rem;
            }

            .coming-soon-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">OurShow</a>
            <div class="nav-right">
                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="discover.html" class="nav-link"><i class="fas fa-compass"></i> Discover</a></li>
                    <li><a href="news.html" class="nav-link active"><i class="fas fa-newspaper"></i> News</a></li>
                    <li><a href="collection.html" class="nav-link"><i class="fas fa-bookmark"></i> Collections</a></li>
                    <li><a href="communitychat.html" class="nav-link"><i class="fas fa-comments"></i> Chat</a></li>
                </ul>
                <div class="nav-actions">
                    <a href="profile.html" class="auth-btn"><i class="fas fa-user"></i> Profile</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="news-container">

        <div class="news-header">
            <h1>Cinema Center</h1>
            <p style="color: var(--text-secondary);">Your Hub for Everything Movies</p>
        </div>

        <!-- MAIN NAVIGATION TABS -->
        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('upcoming')">
                <i class="fas fa-calendar-alt"></i> Coming Soon
            </button>
            <button class="tab-btn" onclick="switchTab('headlines')">
                <i class="fas fa-globe"></i> Headlines
            </button>
        </div>

        <!-- TAB 1: COMING SOON -->
        <div id="tab-upcoming" class="tab-content active">
            <div class="section-header">
                <h2>Upcoming Releases</h2>
                <div class="section-controls">
                    <button class="chip active" onclick="loadUpcoming('week', this)">This Week</button>
                    <button class="chip" onclick="loadUpcoming('this_month', this)">This Month</button>
                    <button class="chip" onclick="loadUpcoming('next_month', this)">Next Month</button>
                </div>
            </div>
            <div class="coming-soon-grid" id="upcomingGrid">
                <!-- Posters grid -->
            </div>
        </div>

        <!-- TAB 2: HEADLINES -->
        <div id="tab-headlines" class="tab-content">
            <div class="section-header">
                <h2>Industry News</h2>
                <div class="section-controls">
                    <button class="chip active" onclick="loadGeneralNews('global', this)">Global</button>
                    <button class="chip" onclick="loadGeneralNews('nepal', this)">🇳🇵 Nepal</button>
                    <button class="chip" onclick="loadGeneralNews('bollywood', this)">Bollywood</button>
                </div>
            </div>

            <div class="search-container">
                <input type="text" id="newsSearchInput" placeholder="Search news topics...">
                <button id="newsSearchBtn"><i class="fas fa-search"></i></button>
            </div>

            <div class="news-grid" id="generalNewsGrid">
                <!-- Articles -->
            </div>
        </div>

    </div>

    <script type="module" src="news.js"></script>
    <script src="public/mobile-nav.js"></script>

    <script>
        // Tab Switcher Helper (Inline for speed)
        window.switchTab = function (tabName) {
            // Buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.getAttribute('onclick').includes(tabName)) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            // Content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById('tab-' + tabName).classList.add('active');
        }
    </script>
</body>

</html>
