<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie News - OurShow</title>
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="themes.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" href="public/logo.jpg">
    <link rel="apple-touch-icon" href="public/logo.jpg">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .news-container {
            max-width: 1200px;
            margin: 6rem auto 2rem;
            padding: 0 1.5rem;
        }

        .news-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .news-header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .news-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .news-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #1e293b;
        }

        .news-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .news-source {
            font-size: 0.8rem;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .news-date {
            color: var(--text-secondary);
            font-weight: 400;
        }

        .news-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        .read-more-btn {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            padding: 0.8rem;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s;
            margin-top: auto;
        }

        .read-more-btn:hover {
            background: var(--primary-color);
        }

        .loader-container {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
        }

        /* Standard property for compatibility */
        .news-title,
        .news-desc {
            line-clamp: 3;
        }

        @media (max-width: 600px) {
            .news-container {
                margin-top: 5rem;
                padding: 0 1rem;
            }

            .news-header h1 {
                font-size: 2rem;
            }

            .news-grid {
                grid-template-columns: 1fr;
                /* Stack vertically on mobile */
                gap: 1.5rem;
            }

            .news-image {
                height: 180px;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">OurShow</a>
            <div class="nav-right">
                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="discover.html" class="nav-link"><i class="fas fa-compass"></i> Discover</a></li>
                    <li><a href="news.html" class="nav-link active"><i class="fas fa-newspaper"></i> News</a></li>
                    <li><a href="collection.html" class="nav-link"><i class="fas fa-bookmark"></i> Collections</a></li>
                    <li><a href="communitychat.html" class="nav-link"><i class="fas fa-comments"></i> Chat</a></li>
                </ul>
                <div class="nav-actions">
                    <a href="profile.html" class="auth-btn"><i class="fas fa-user"></i> Profile</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="news-container">
        <div class="news-header">
            <h1>Latest Headlines</h1>
            <p style="color: var(--text-secondary);">Updates from the world of Cinema & TV</p>
        </div>

        <div class="news-grid" id="newsGrid">
            <div class="loader-container">
                <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--primary-color);"></i>
                <p style="margin-top: 1rem; color: var(--text-secondary);">Fetching latest news...</p>
            </div>
        </div>
    </div>

    <script type="module" src="news.js"></script>
    <script src="public/mobile-nav.js"></script>
</body>

</html>
