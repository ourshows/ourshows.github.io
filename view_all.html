<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View All - OurShow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .load-more-btn {
            display: block;
            width: 200px;
            margin: 3rem auto;
            padding: 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s;
        }

        .load-more-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">OurShow</a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="margin-top: 6rem;">
        <h1 class="page-title" id="pageTitle">Loading...</h1>
        <div class="grid-container" id="mediaGrid">
            <!-- Items will be injected here -->
        </div>
        <button id="loadMoreBtn" class="load-more-btn">Load More</button>
    </div>

    <!-- Reuse the modal structure from index.html (simplified) -->
    <!-- Ideally we should componentize this, but for now we'll just link back to index or duplicate modal logic if needed. 
         Actually, let's just use a simple redirect to the movie details or reuse the modal logic if we copy it.
         For simplicity, let's copy the modal structure and logic. -->

    <div id="movieModal" class="modal" style="display: none;">
        <div class="modal-content glass-panel">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <img id="modalPoster" src="" alt="Poster" class="modal-poster">
                <div class="modal-header-info">
                    <h2 id="modalTitle"></h2>
                    <p id="modalOverview"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="view_all.js" type="module"></script>
</body>

</html>
