<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View All - OurShow</title>
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="public/modal.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
            width: 100%;
        }

        .load-more-btn {
            display: block;
            width: 200px;
            margin: 3rem auto;
            padding: 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s;
        }

        .load-more-btn:hover {
            transform: scale(1.05);
        }

        /* Mobile Adjustments for Modal */
        @media (max-width: 768px) {
            .modal-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .modal-poster {
                width: 180px;
                margin-bottom: 1rem;
            }

            .modal-actions {
                justify-content: center;
            }

            .modal-meta {
                justify-content: center;
            }
        }

        .review-avatar {
            width: 24px !important;
            height: 24px !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            flex-shrink: 0;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">OurShow</a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="margin-top: 6rem;">
        <h1 class="page-title" id="pageTitle">Loading...</h1>
        <style>
            .view-all-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 2rem 1.5rem;
                padding-bottom: 2rem;
            }

            .loading-sentinel {
                width: 100%;
                height: 100px;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .loader-spinner {
                width: 40px;
                height: 40px;
                border: 4px solid rgba(255, 255, 255, 0.1);
                border-top: 4px solid var(--primary-color);
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
        <div class="view-all-grid" id="mediaGrid">
            <!-- Items will be injected here -->
        </div>
        <div id="loadingSentinel" class="loading-sentinel">
            <div class="loader-spinner"></div>
        </div>
    </div>

    <!-- Movie Details Modal -->
    <div id="movieModal" class="modal" style="display: none;">
        <div class="modal-content glass-panel">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-body">
                <div class="modal-header">
                    <div class="modal-poster-container">
                        <img id="modalPoster" src="" alt="Poster" class="modal-poster">
                        <!-- Verdict Meter (Universal - visible on mobile below poster) -->
                        <div id="pcVerdictMeter" class="verdict-meter-container"></div>
                    </div>

                    <div class="modal-header-info">
                        <h2 id="modalTitle"></h2>
                        <div class="modal-meta">
                            <span class="rating-badge" id="modalRating"></span>
                            <span id="modalYear"></span>
                            <span id="modalRuntime"></span>
                        </div>
                        <p id="modalOverview" style="display: none;"></p> <!-- Hidden in header, shown in tab -->

                        <!-- Action Buttons -->
                        <div class="modal-actions">
                            <button class="glass-button" onclick="markAsWatched()"><i class="fas fa-check"></i>
                                Watched</button>
                            <button class="glass-button" onclick="addToWatchLater()"><i class="fas fa-clock"></i> Watch
                                Later</button>
                            <button class="glass-button primary" onclick="watchNow()"><i class="fas fa-play"></i> Watch
                                Now</button>
                        </div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="modal-tabs">
                    <button class="tab-btn active" onclick="switchTab('overview')">Overview</button>
                    <button class="tab-btn" onclick="switchTab('cast')">Cast & Crew</button>
                    <button class="tab-btn" onclick="switchTab('reviews')">Reviews</button>
                    <button class="tab-btn" onclick="switchTab('similar')">Similar</button>
                    <button class="tab-btn" onclick="switchTab('ai')">Ask AI</button>
                </div>

                <!-- Tab Content -->

                <!-- Overview Tab -->
                <div id="tab-overview" class="tab-content active">
                    <p id="modalOverviewText" class="modal-overview"
                        style="margin-bottom: 1.5rem; line-height: 1.6; color: var(--text-secondary);"></p>

                    <div id="modalTrailer"></div>
                    <div id="modalGenres"></div>

                    <!-- Rating System -->
                    <div class="rating-section">
                        <h3>Rate This Movie</h3>
                        <div class="rating-buttons">
                            <button class="rating-btn" data-rating="Pass" onclick="rateMovie('Pass')">😞 Pass</button>
                            <button class="rating-btn" data-rating="One Time Watch"
                                onclick="rateMovie('One Time Watch')">😐 One-Time Watch</button>
                            <button class="rating-btn" data-rating="Go For It" onclick="rateMovie('Go For It')">🙂 Go
                                For It</button>
                            <button class="rating-btn" data-rating="Perfection" onclick="rateMovie('Perfection')">🤩
                                Perfection</button>
                        </div>
                        <textarea id="reviewText" class="glass-input" placeholder="Write your review..."
                            rows="4"></textarea>
                        <button class="glass-button" onclick="submitReview()">Submit Review</button>
                    </div>
                </div>

                <!-- Cast Tab -->
                <div id="tab-cast" class="tab-content" style="display: none;">
                    <h3>Cast</h3>
                    <div id="modalCast" class="cast-grid"></div>
                </div>

                <!-- Reviews Tab -->
                <div id="tab-reviews" class="tab-content" style="display: none;">
                    <h3>User Reviews</h3>
                    <div id="modalReviews"></div>
                    <div class="add-review-section"
                        style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--glass-border);">
                        <h3>Add Your Review</h3>
                        <div class="rating-select" style="margin: 1rem 0; display: flex; gap: 0.5rem; flex-wrap: wrap;">
                            <button class="rating-btn" onclick="rateMovie('Skip')" data-rating="Skip">Skip
                                🔴</button>
                            <button class="rating-btn" onclick="rateMovie('One Time Watch')"
                                data-rating="One Time Watch">One Time Watch 🟠</button>
                            <button class="rating-btn" onclick="rateMovie('Go For It')" data-rating="Go For It">Go
                                For It 🟢</button>
                            <button class="rating-btn" onclick="rateMovie('Perfection')"
                                data-rating="Perfection">Perfection 🌟</button>
                        </div>
                        <textarea id="reviewText" class="glass-input" rows="3"
                            placeholder="Write your review..."></textarea>
                        <button class="glass-button" onclick="submitReview()" style="margin-top: 1rem;">Submit
                            Review</button>
                    </div>
                </div>

                <!-- Similar Tab -->
                <div id="tab-similar" class="tab-content" style="display: none;">
                    <h3>Similar Titles</h3>
                    <div id="modalSimilar" class="media-scroller"></div>
                </div>

                <!-- AI Chat Tab -->
                <div id="tab-ai" class="tab-content" style="display: none;">
                    <h3>Ask AI About This Movie</h3>
                    <div id="aiChat" class="ai-chat-container"></div>
                    <div class="ai-input-group">
                        <input type="text" id="aiQuestion" class="glass-input"
                            placeholder="Ask about facts, trivia, spoilers...">
                        <button class="glass-button" onclick="askAI()"><i class="fas fa-paper-plane"></i> Ask</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="public-config.js"></script>

    <script src="view_all.js" type="module"></script>
</body>

</html>
