<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - OurShow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-header {
            text-align: center;
            padding: 4rem 0;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.2), transparent);
        }

        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--primary-color);
            margin-bottom: 1.5rem;
            object-fit: cover;
        }

        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin: 2rem 0;
        }

        .p-stat {
            text-align: center;
        }

        .p-stat-val {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .p-stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .profile-nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
        }

        .tab-link {
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            border-radius: 20px;
            transition: background 0.3s;
        }

        .tab-link.active {
            background: var(--glass-highlight);
            color: var(--primary-color);
            font-weight: 600;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .movie-card {
            cursor: pointer;
            transition: transform 0.3s;
        }

        .movie-card:hover {
            transform: scale(1.05);
        }

        .movie-card img {
            width: 100%;
            border-radius: 12px;
        }

        .edit-buttons {
            margin-top: 1rem;
        }

        #saveBtn,
        #cancelBtn,
        #uploadPicBtn {
            display: none;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">OurShow</a>
            <a onclick="logout()" class="nav-link" style="cursor: pointer;"><i class="fas fa-sign-out-alt"></i>
                Logout</a>
        </div>
    </nav>

    <div class="profile-header">
        <img id="profilePic" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff"
            class="profile-avatar" alt="Profile">
        <h1 id="userName">Loading...</h1>
        <p id="userEmail" style="color: var(--text-secondary);"></p>

        <div class="edit-buttons">
            <button class="glass-button" id="editBtn" onclick="enableEdit()"><i class="fas fa-edit"></i> Edit
                Profile</button>
            <button class="glass-button" id="saveBtn" onclick="saveProfile()"><i class="fas fa-save"></i> Save</button>
            <button class="glass-button" id="cancelBtn" onclick="cancelEdit()"><i class="fas fa-times"></i>
                Cancel</button>
            <button class="glass-button" id="uploadPicBtn" onclick="uploadProfilePic()"><i class="fas fa-camera"></i>
                Change Picture</button>
        </div>

        <div class="profile-stats">
            <div class="p-stat">
                <div class="p-stat-val" id="watchlistCount">0</div>
                <div class="p-stat-label">Watchlist</div>
            </div>
            <div class="p-stat">
                <div class="p-stat-val" id="watchedCount">0</div>
                <div class="p-stat-label">Watched</div>
            </div>
            <div class="p-stat">
                <div class="p-stat-val" id="reviewsCount">0</div>
                <div class="p-stat-label">Reviews</div>
            </div>
        </div>

        <button class="glass-button" onclick="window.location.href='stats.html'">View Full Stats</button>
    </div>

    <div class="container">
        <div class="profile-nav">
            <div class="tab-link active" onclick="switchTab('watchlist')">Watchlist</div>
            <div class="tab-link" onclick="switchTab('watched')">Watched</div>
            <div class="tab-link" onclick="switchTab('reviews')">Reviews</div>
        </div>

        <!-- Watchlist Tab -->
        <div id="watchlist" class="tab-pane active">
            <div id="watchlistGrid" class="movie-grid">
                <p style="grid-column: 1/-1; text-align: center;">Loading...</p>
            </div>
        </div>

        <!-- Watched Tab -->
        <div id="watched" class="tab-pane">
            <div id="watchedGrid" class="movie-grid">
                <p style="grid-column: 1/-1; text-align: center;">Loading...</p>
            </div>
        </div>

        <!-- Reviews Tab -->
        <div id="reviews" class="tab-pane">
            <div id="reviewsGrid">
                <p style="text-align: center;">Loading...</p>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="profile.js" type="module"></script>
</body>

</html>
