<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - OurShow</title>
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="themes.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" href="public/logo.jpg">
    <link rel="apple-touch-icon" href="public/logo.jpg">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .leaderboard-container {
            max-width: 900px;
            margin: 6rem auto 2rem;
            padding: 0 1.5rem;
        }

        .leaderboard-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .leaderboard-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ffa500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .podium {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 1rem;
            margin-bottom: 3rem;
            height: 250px;
        }

        .podium-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 120px;
        }

        .podium-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            object-fit: cover;
            margin-bottom: 0.5rem;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .podium-block {
            width: 100%;
            background: linear-gradient(to bottom, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.05));
            border-top: 3px solid #ffd700;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 1rem;
            color: var(--text-primary);
            font-weight: 700;
        }

        .first .podium-block {
            height: 160px;
            border-color: #ffd700;
            background: linear-gradient(to bottom, rgba(255, 215, 0, 0.3), rgba(255, 215, 0, 0.1));
        }

        .second .podium-block {
            height: 120px;
            border-color: #c0c0c0;
            background: linear-gradient(to bottom, rgba(192, 192, 192, 0.3), rgba(192, 192, 192, 0.1));
        }

        .third .podium-block {
            height: 90px;
            border-color: #cd7f32;
            background: linear-gradient(to bottom, rgba(205, 127, 50, 0.3), rgba(205, 127, 50, 0.1));
        }

        .second .podium-avatar {
            border-color: #c0c0c0;
            box-shadow: 0 0 15px rgba(192, 192, 192, 0.3);
            width: 60px;
            height: 60px;
        }

        .third .podium-avatar {
            border-color: #cd7f32;
            box-shadow: 0 0 15px rgba(205, 127, 50, 0.3);
            width: 60px;
            height: 60px;
        }

        .rank-badge {
            font-size: 1.5rem;
            margin-bottom: 0.2rem;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 0.5rem 1.5rem;
            border-radius: 99px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .list-header {
            display: grid;
            grid-template-columns: 60px 1fr 120px;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px 12px 0 0;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .list-row {
            display: grid;
            grid-template-columns: 60px 1fr 120px;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            align-items: center;
            transition: background 0.2s;
        }

        .list-row:last-child {
            border-bottom: none;
        }

        .list-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .rank-num {
            font-weight: 700;
            color: var(--text-secondary);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name {
            font-weight: 600;
        }

        .user-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .stat-val {
            text-align: right;
            font-weight: 700;
            color: #ffd700;
            font-size: 1.1rem;
        }

        .list-wrapper {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(12px);
        }

        .my-row {
            background: rgba(124, 58, 237, 0.15) !important;
            border-left: 3px solid var(--primary-color);
        }

        @media (max-width: 600px) {
            .leaderboard-container {
                margin-top: 5rem;
                padding: 0 1rem;
            }

            .leaderboard-header h1 {
                font-size: 2rem;
            }

            /* Podium adjustments */
            .podium {
                gap: 0.5rem;
                height: 220px;
            }

            .podium-item {
                width: 30%;
                /* Fluid width */
                min-width: 80px;
            }

            .podium-avatar {
                width: 50px;
                height: 50px;
            }

            .second .podium-avatar,
            .third .podium-avatar {
                width: 40px;
                height: 40px;
            }

            .podium-block {
                font-size: 0.8rem;
                padding-top: 0.5rem;
            }

            /* List adjustments */
            .list-header,
            .list-row {
                grid-template-columns: 40px 1fr 80px;
                /* Tighter columns */
                padding: 1rem;
                gap: 0.5rem;
            }

            .user-img {
                width: 32px;
                height: 32px;
            }

            .user-name {
                font-size: 0.9rem;
            }

            .user-title {
                font-size: 0.7rem;
            }

            .stat-val {
                font-size: 1rem;
            }

            .nav-links {
                display: none !important;
            }
        }
    </style>

</head>

<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="container nav-content"><a href="index.html" class="logo">OurShow</a>
            <div class="nav-right">
                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i>Home</a></li>
                    <li><a href="discover.html" class="nav-link"><i class="fas fa-compass"></i>Discover</a></li>
                    <li><a href="collection.html" class="nav-link"><i class="fas fa-bookmark"></i>Collections</a>
                    </li>
                    <li><a href="communitychat.html" class="nav-link"><i class="fas fa-comments"></i>Chat</a></li>
                </ul>
                <div class="nav-actions"><a href="profile.html" class="auth-btn"><i class="fas fa-user"></i>Profile</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="leaderboard-container">
        <div class="leaderboard-header">
            <h1>Hall of Fame</h1>
            <p style="color: var(--text-secondary);">Top watchers in the OurShow community</p>
        </div>
        <div class="filters"><button class="filter-btn active" onclick="loadLeaderboard('totalHours', this)">Total
                Hours</button><button class="filter-btn" onclick="loadLeaderboard('totalMovies', this)">Movies
                Watched</button><button class="filter-btn" onclick="loadLeaderboard('totalSeries', this)">Series
                Watched</button></div>
        <!-- Podium (Top 3) -->
        <div class="podium" id="podiumArea" style="display:none;"></div>
        <!-- List -->
        <div class="list-wrapper">
            <div class="list-header"><span>Rank</span><span>User</span><span style="text-align: right;"
                    id="statLabel">Hours</span></div>
            <div id="leaderboardList">
                <div style="padding: 3rem; text-align: center;"><i class="fas fa-circle-notch fa-spin"
                        style="font-size: 2rem; color: var(--primary-color);"></i></div>
            </div>
        </div>
    </div>
    <script type="module" src="leaderboard.js"></script>
    <script src="public/mobile-nav.js"></script>
</body>

</html>
