<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cast Details - OurShow</title>
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="themes.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" href="public/logo.jpg">
    <link rel="apple-touch-icon" href="public/logo.jpg">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        .cast-header {
            display: flex;
            gap: 2rem;
            margin-top: 6rem;
            margin-bottom: 3rem;
        }

        .cast-profile-img {
            width: 300px;
            height: 450px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .cast-info {
            flex: 1;
        }

        .cast-name {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .cast-meta {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            display: flex;
            gap: 1.5rem;
        }

        .cast-bio {
            color: #ccc;
            line-height: 1.8;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            max-width: 800px;
        }

        .bio-toggle {
            color: var(--primary-color);
            cursor: pointer;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            padding-left: 1rem;
            border-left: 4px solid var(--primary-color);
        }

        .credits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .cast-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .cast-profile-img {
                width: 200px;
                height: 300px;
            }

            .cast-meta {
                justify-content: center;
                flex-wrap: wrap;
                gap: 1rem;
            }

            .cast-name {
                font-size: 2.5rem;
            }

            .cast-bio {
                text-align: left;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">OurShow</a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="search.html" class="nav-link">Search</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container" id="castContainer">
        <!-- Cast Header -->
        <div class="cast-header" id="castHeader">
            <!-- Injected by JS -->
            <div class="skeleton" style="width: 300px; height: 450px; border-radius: 12px;"></div>
            <div style="flex:1">
                <div class="skeleton" style="width: 60%; height: 60px; margin-bottom: 1rem;"></div>
                <div class="skeleton" style="width: 40%; height: 30px; margin-bottom: 2rem;"></div>
                <div class="skeleton" style="width: 100%; height: 150px;"></div>
            </div>
        </div>

        <!-- Known For -->
        <h2 class="section-title">Known For</h2>
        <div class="credits-grid" id="knownForGrid">
            <!-- Injected by JS -->
            <div class="media-card skeleton" style="height: 300px;"></div>
            <div class="media-card skeleton" style="height: 300px;"></div>
            <div class="media-card skeleton" style="height: 300px;"></div>
            <div class="media-card skeleton" style="height: 300px;"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="public-config.js"></script>
    <script src="cast.js" type="module"></script>
</body>

</html>
