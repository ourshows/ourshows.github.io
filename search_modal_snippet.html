<!-- Search Modal -->
<div id="searchModal" class="modal" style="display: none;">
    <div class="modal-content glass-panel search-modal-content">
        <span class="close-modal" onclick="closeSearch()">&times;</span>
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="modalSearchInput" placeholder="Search for movies, TV shows..."
                class="search-input-large" autofocus>
        </div>
        <div id="searchResults" class="search-results-grid"></div>
    </div>
</div>
