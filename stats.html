<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Stats - OurShow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            padding: 2rem;
            text-align: center;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        .badges-section {
            margin-top: 3rem;
        }

        .badges-grid {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .badge {
            width: 120px;
            height: 120px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--glass-border);
            transition: transform 0.3s;
            cursor: pointer;
            position: relative;
        }

        .badge:hover {
            transform: scale(1.1) rotate(5deg);
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(219, 39, 119, 0.3);
        }

        .badge i {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #fbbf24;
        }

        .badge span {
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge.locked {
            opacity: 0.5;
            filter: grayscale(1);
        }

        .badge.locked::after {
            content: '\f023';
            /* Lock icon */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">OurShow Stats</a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="margin-top: 4rem;">
        <h1 class="section-title">Your Viewing Habits</h1>

        <div class="stats-grid">
            <div class="glass-panel stat-card">
                <div class="stat-value" id="totalHours">142</div>
                <div class="stat-label">Hours Watched</div>
            </div>
            <div class="glass-panel stat-card">
                <div class="stat-value" id="moviesCount">45</div>
                <div class="stat-label">Movies</div>
            </div>
            <div class="glass-panel stat-card">
                <div class="stat-value" id="seriesCount">12</div>
                <div class="stat-label">Series Completed</div>
            </div>
            <div class="glass-panel stat-card">
                <div class="stat-value" id="streakDays">7</div>
                <div class="stat-label">Day Streak 🔥</div>
            </div>
        </div>

        <div class="badges-section">
            <h2 class="section-title">Achievements</h2>
            <div class="badges-grid">
                <div class="badge" title="Watched 10 movies in a week">
                    <i class="fas fa-couch"></i>
                    <span>Binge Watcher</span>
                </div>
                <div class="badge" title="Watched 5 Horror movies">
                    <i class="fas fa-ghost"></i>
                    <span>Fearless</span>
                </div>
                <div class="badge locked" title="Watch 100 movies (Locked)">
                    <i class="fas fa-film"></i>
                    <span>Cinephile</span>
                </div>
                <div class="badge locked" title="Review 50 items (Locked)">
                    <i class="fas fa-pen-nib"></i>
                    <span>Critic</span>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>`n    <script src="stats.js" type="module"></script>
</body>

</html>
