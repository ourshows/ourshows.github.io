<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Stats - OurShow</title>
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="themes.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            padding: 2rem;
            text-align: center;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        .badges-section {
            margin-top: 3rem;
        }

        .badges-grid {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .badge {
            width: 120px;
            height: 120px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--glass-border);
            transition: transform 0.3s;
            cursor: pointer;
            position: relative;
        }

        .badge:hover {
            transform: scale(1.1) rotate(5deg);
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(219, 39, 119, 0.3);
        }

        .badge i {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #fbbf24;
        }

        .badge span {
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge.locked {
            opacity: 0.5;
            filter: grayscale(1);
        }

        .badge.locked::after {
            content: '\f023';
            /* Lock icon */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar" id="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">OurShow</a>

            <div class="nav-right" id="navRight">
                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="discovery.html" class="nav-link"><i class="fas fa-compass"></i> Discover</a></li>
                    <li><a href="collectiom.html" class="nav-link"><i class="fas fa-bookmark"></i> Collections</a></li>
                    <li><a href="watchedlist.html" class="nav-link active"><i class="fas fa-list"></i> Watchlist</a>
                    </li>
                    <li><a href="communitychat.html" class="nav-link"><i class="fas fa-comments"></i> Chat</a></li>
                </ul>

                <div class="nav-actions">
                    <button class="icon-btn theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                        <i class="fas fa-moon"></i>
                    </button>
                    <a href="login.html" class="auth-btn" id="navAuthBtn">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </a>
                </div>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <div class="container" style="margin-top: 7rem;">
        <div
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
            <h1 class="section-title" style="margin-bottom: 0;">Your Viewing Habits</h1>
            <div style="display: flex; gap: 1rem;">
                <a href="watchedlist.html" class="glass-button"><i class="fas fa-check-circle"></i> Watched History</a>
                <a href="watchlater.html" class="glass-button"><i class="fas fa-clock"></i> Watch Later</a>
            </div>
        </div>

        <div class="stats-grid">
            <div class="glass-panel stat-card">
                <div class="stat-value" id="totalHours">0</div>
                <div class="stat-label">Hours Watched</div>
            </div>
            <div class="glass-panel stat-card">
                <div class="stat-value" id="moviesCount">0</div>
                <div class="stat-label">Movies</div>
            </div>
            <div class="glass-panel stat-card">
                <div class="stat-value" id="seriesCount">0</div>
                <div class="stat-label">Series Completed</div>
            </div>
            <div class="glass-panel stat-card">
                <div class="stat-value" id="streakDays">0</div>
                <div class="stat-label">Day Streak 🔥</div>
            </div>
        </div>

        <div class="badges-section">
            <h2 class="section-title">Achievements</h2>
            <div class="badges-grid">
                <!-- Badges will be generated by JS -->
            </div>
        </div>

        <div id="loading" style="text-align: center; margin-top: 2rem;">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="stats.js" type="module"></script>
    <script src="auth.js"></script>

    <script>
        // Theme Toggle Simple Script for this page if not imported
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.querySelector('.theme-toggle i').className = newTheme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
        }
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Mobile Menu
        const mobileBtn = document.getElementById('mobileMenuBtn');
        const navRight = document.getElementById('navRight');
        if (mobileBtn && navRight) {
            mobileBtn.addEventListener('click', () => {
                navRight.classList.toggle('active');
            });
        }
    </script>
</body>

</html>
