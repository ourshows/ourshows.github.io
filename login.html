<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OurShow</title>
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="themes.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Split Layout Styles */
        body.login-body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            height: 100vh;
            display: flex;
        }

        /* Left Side: Login Form */
        .login-pane {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            background: rgba(3, 7, 18, 0.95);
            /* Dark background for contrast */
            position: relative;
            box-shadow: 20px 0 50px rgba(0, 0, 0, 0.8);
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 3rem;
            background: transparent !important;
            /* Remove glass panel background to blend */
            box-shadow: none !important;
            border: none !important;
        }

        /* Right Side: Waterfall Animation */
        .visual-pane {
            flex: 1;
            position: relative;
            background: #0f0f0f;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* Gradient Overlay on Waterfall */
        .visual-pane::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(3, 7, 18, 1) 0%, transparent 20%, transparent 80%, rgba(3, 7, 18, 0.4) 100%);
            z-index: 10;
            pointer-events: none;
        }

        .waterfall-container {
            display: flex;
            gap: 1.5rem;
            height: 120%;
            transform: translateY(-10%);
        }

        .poster-track {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 180px;
            /* Slightly slimmer columns */
            flex-shrink: 0;
        }

        .poster-track.scrolling-up {
            animation: scrollUp 60s linear infinite;
        }

        .poster-track.scrolling-down {
            animation: scrollDown 60s linear infinite;
        }

        .track-poster {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            aspect-ratio: 2/3;
            object-fit: cover;
            filter: brightness(0.7);
            transition: filter 0.3s, transform 0.3s;
        }

        .track-poster:hover {
            filter: brightness(1);
            transform: scale(1.05);
            z-index: 5;
        }

        @keyframes scrollUp {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-50%);
            }
        }

        @keyframes scrollDown {
            0% {
                transform: translateY(-50%);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body.login-body {
                flex-direction: column;
            }

            .visual-pane {
                display: none;
            }

            .login-pane {
                width: 100%;
                /* Premium gradient for mobile */
                background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
                padding: 1.5rem;
            }

            .login-box {
                padding: 1.5rem;
                max-width: 100%;
            }

            .logo {
                font-size: 2.8rem !important;
            }
        }

        /* Custom Input Styles override */
        .glass-input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary-color);
        }
    </style>
</head>

<body class="login-body">

    <!-- Left Pane: Login Form -->
    <div class="login-pane">
        <div class="login-box">
            <h1 class="logo"
                style="font-size: 3.5rem; margin-bottom: 0.5rem; text-shadow: 0 4px 20px rgba(124, 58, 237, 0.5);">
                OurShow</h1>
            <p
                style="color: var(--text-secondary); margin-bottom: 3rem; font-size: 1.2rem; line-height: 1.6; font-weight: 500;">
                Discover, Discuss, and Recommend.
            </p>

            <button class="social-btn" id="googleLoginBtn" style="transition: all 0.3s; border: none; font-size: 1rem;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="24" alt="Google">
                Continue with Google
            </button>

            <div class="divider" style="margin: 2rem 0;"><span>OR CONTINUE WITH EMAIL</span></div>

            <form id="emailLoginForm">
                <div style="margin-bottom: 1.2rem;">
                    <input type="email" id="emailInput" class="glass-input" placeholder="Email Address" required
                        style="padding: 1rem;">
                </div>
                <div style="margin-bottom: 2rem;">
                    <input type="password" id="passwordInput" class="glass-input" placeholder="Password" required
                        style="padding: 1rem;">
                </div>
                <button type="submit" class="glass-button" id="loginBtn"
                    style="width: 100%; background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); border: none; padding: 1rem; font-size: 1.1rem; font-weight: 600;">
                    Log In
                </button>
            </form>

            <div style="margin-top: 2rem; display: flex; flex-direction: column; gap: 1.5rem; text-align: center;">
                <p style="font-size: 0.95rem; color: var(--text-secondary);">
                    New here? <a href="#" style="color: var(--primary-color); font-weight: 600;">Create an account</a>
                </p>
                <a href="index.html"
                    style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; transition: color 0.3s;">
                    Skip and Continue as Guest &rarr;
                </a>
            </div>
        </div>
    </div>

    <!-- Right Pane: Waterfall Animation -->
    <div class="visual-pane">
        <div class="waterfall-container" id="waterfallContainer">
            <!-- Tracks injected by JS -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="public-config.js"></script>

    <!-- Firebase SDK -->
    <script type="module">
        // Import pre-initialized auth objects from our config module
        // Imported wrappers which now point to real config
        import { auth, provider, signInWithPopup, signInWithEmailAndPassword } from "./firebase-wrapper.js";

        // --- Google Login ---
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            if (!auth) {
                alert("Error: Firebase Authentication is not available. Check firebase-config.js.");
                return;
            }
            try {
                // Use the exported googleProvider instance
                const result = await signInWithPopup(auth, provider);
                saveUser(result.user);
            } catch (error) {
                console.error(error);
                alert("Login Failed: " + error.message);
            }
        });

        // --- Email Login ---
        document.getElementById('emailLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passwordInput').value;

            if (auth) {
                signInWithEmailAndPassword(auth, email, pass)
                    .then(cred => saveUser(cred.user))
                    .catch(err => alert("Error: " + err.message));
            } else {
                // Should not really happen if auth is present, but fallback:
                alert("Firebase Auth instance not found for email login.");
            }
        });

        function saveUser(user) {
            localStorage.setItem('userEmail', user.email);
            localStorage.setItem('userName', user.displayName || user.email.split('@')[0]);
            localStorage.setItem('userPhoto', user.photoURL || `https://ui-avatars.com/api/?name=${user.email}&background=random`);
            localStorage.setItem('userId', user.uid);
            localStorage.setItem('isLoggedIn', 'true');
            window.location.href = 'index.html';
        }

        // --- Waterfall Animation Logic ---
        async function initWaterfall() {
            if (!window.APP_CONFIG) return;

            const trendingUrl = `${window.APP_CONFIG.TMDB_BASE_URL}/trending/all/week?api_key=${window.APP_CONFIG.TMDB_API_KEY}`;
            const cultUrl = `${window.APP_CONFIG.TMDB_BASE_URL}/movie/top_rated?api_key=${window.APP_CONFIG.TMDB_API_KEY}&page=1`; // Proxy for Cult Classics

            try {
                // Fetch both sources in parallel
                // Use Promise.allSettled to avoid failing everything if one fails
                const results = await Promise.allSettled([
                    fetch(trendingUrl),
                    fetch(cultUrl)
                ]);

                // Helper to get json from settled promise
                const getData = async (res) => {
                    if (res.status === 'fulfilled' && res.value.ok) {
                        return await res.value.json();
                    }
                    return { results: [] };
                };

                const trendingData = await getData(results[0]);
                const cultData = await getData(results[1]);

                const trendingPosters = (trendingData.results || []).filter(m => m.poster_path).map(m => m.poster_path);
                const cultPosters = (cultData.results || []).filter(m => m.poster_path).map(m => m.poster_path);

                // Combine and shuffle for uniqueness
                let combined = [...trendingPosters, ...cultPosters];
                combined = combined.sort(() => Math.random() - 0.5);

                // Remove duplicates
                combined = [...new Set(combined)];

                if (combined.length > 20) {
                    // Split into 4 unique columns
                    const chunkSize = Math.floor(combined.length / 4);
                    const col1 = combined.slice(0, chunkSize);
                    const col2 = combined.slice(chunkSize, chunkSize * 2);
                    const col3 = combined.slice(chunkSize * 2, chunkSize * 3);
                    const col4 = combined.slice(chunkSize * 3);

                    createTrack(col1, 50, 'up');
                    createTrack(col2, 70, 'down');
                    createTrack(col3, 55, 'up');
                    createTrack(col4, 65, 'down');
                } else {
                    // Fallback if not enough unique data
                    const list1 = trendingPosters.length ? trendingPosters : cultPosters;
                    createTrack(list1, 50, 'up');
                    createTrack(list1, 60, 'down');
                    createTrack(list1, 55, 'up');
                    createTrack(list1, 65, 'down');
                }
            } catch (e) {
                console.error("Animation load failed", e);
            }
        }

        function createTrack(images, speed, dir) {
            const container = document.getElementById('waterfallContainer');
            const track = document.createElement('div');
            track.className = `poster-track scrolling-${dir}`;
            track.style.animationDuration = `${speed}s`;

            // Loop twice for smooth scroll
            const loopImages = [...images, ...images];

            loopImages.forEach(path => {
                const img = document.createElement('img');
                // Use public config or fallback directly
                const baseUrl = window.APP_CONFIG?.TMDB_IMAGE_SMALL_URL || "https://image.tmdb.org/t/p/w500";
                img.src = `${baseUrl}${path}`;
                img.className = 'track-poster';
                img.loading = 'lazy';
                track.appendChild(img);
            });

            container.appendChild(track);
        }

        initWaterfall();

    </script>
</body>

</html>
