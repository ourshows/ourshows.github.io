<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OurShow</title>
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="themes.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Split Layout Styles */
        body.login-body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            height: 100vh;
            display: flex;
        }

        /* Left Side: Login Form */
        .login-pane {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            background: rgba(3, 7, 18, 0.95);
            /* Dark background for contrast */
            position: relative;
            box-shadow: 20px 0 50px rgba(0, 0, 0, 0.8);
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 3rem;
            background: transparent !important;
            /* Remove glass panel background to blend */
            box-shadow: none !important;
            border: none !important;
        }

        /* Right Side: Waterfall Animation */
        .visual-pane {
            flex: 1;
            position: relative;
            background: #0f0f0f;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* Gradient Overlay on Waterfall */
        .visual-pane::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(3, 7, 18, 1) 0%, transparent 20%, transparent 80%, rgba(3, 7, 18, 0.4) 100%);
            z-index: 10;
            pointer-events: none;
        }

        .waterfall-container {
            display: flex;
            gap: 1.5rem;
            height: 120%;
            transform: translateY(-10%);
        }

        .poster-track {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 180px;
            /* Slightly slimmer columns */
            flex-shrink: 0;
        }

        .poster-track.scrolling-up {
            animation: scrollUp 60s linear infinite;
        }

        .poster-track.scrolling-down {
            animation: scrollDown 60s linear infinite;
        }

        .track-poster {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            aspect-ratio: 2/3;
            object-fit: cover;
            filter: brightness(0.7);
            transition: filter 0.3s, transform 0.3s;
        }

        .track-poster:hover {
            filter: brightness(1);
            transform: scale(1.05);
            z-index: 5;
        }

        @keyframes scrollUp {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-50%);
            }
        }

        @keyframes scrollDown {
            0% {
                transform: translateY(-50%);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body.login-body {
                flex-direction: column;
                height: 100vh;
                overflow-y: auto;
                /* Allow scroll if content is tall */
            }

            .visual-pane {
                display: none;
                /* Keep hidden on mobile to save data/battery */
            }

            .login-pane {
                width: 100%;
                /* Premium animated gradient for mobile */
                background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
                background-size: 400% 400%;
                animation: gradientBG 15s ease infinite;
                padding: 2rem;
                align-items: center;
                /* Center horizontally */
                justify-content: center;
                /* Center vertically */
            }

            @keyframes gradientBG {
                0% {
                    background-position: 0% 50%;
                }

                50% {
                    background-position: 100% 50%;
                }

                100% {
                    background-position: 0% 50%;
                }
            }

            .login-box {
                padding: 2rem;
                max-width: 100%;
                width: 100%;
                background: rgba(0, 0, 0, 0.2) !important;
                /* Slight dark overlay for readability */
                backdrop-filter: blur(10px);
                border-radius: 20px;
                border: 1px solid rgba(255, 255, 255, 0.05) !important;
            }

            .logo {
                font-size: 2.5rem !important;
            }
        }

        /* Custom Input Styles override */
        /* ... */

        // --- Waterfall Animation Logic ---
        async function initWaterfall() {
            // Robust Config Retrieval
            const config=window.PUBLIC_CONFIG || window.APP_CONFIG;
            if ( !config) return console.warn("No config found for waterfall");

            const apiKey=config.TMDB_KEY || config.TMDB_API_KEY;
            const baseUrl=config.TMDB_BASE_URL || "https://api.themoviedb.org/3";
            const imgBase=config.TMDB_IMAGE_SMALL_URL || "https://image.tmdb.org/t/p/w500";

            if ( !apiKey) return console.warn("No API key for waterfall");

            const trendingUrl=`$ {
                baseUrl
            }

            /trending/all/week?api_key=$ {
                apiKey
            }

            `;

            const cultUrl=`$ {
                baseUrl
            }

            /movie/top_rated?api_key=$ {
                apiKey
            }

            &page=1`; // Proxy for Cult Classics

            try {
                // Fetch both sources in parallel
                // Use Promise.allSettled to avoid failing everything if one fails
                const results=await Promise.allSettled([ fetch(trendingUrl),
                    fetch(cultUrl)]);

                // Helper to get json from settled promise
                const getData=async (res)=> {
                    if (res.status==='fulfilled' && res.value.ok) {
                        return await res.value.json();
                    }

                    return {
                        results: []
                    }

                    ;
                }

                ;

                const trendingData=await getData(results[0]);
                const cultData=await getData(results[1]);

                const trendingPosters=(trendingData.results || []).filter(m=> m.poster_path).map(m=> m.poster_path);
                const cultPosters=(cultData.results || []).filter(m=> m.poster_path).map(m=> m.poster_path);

                // Combine and shuffle for uniqueness
                let combined=[...trendingPosters,
                ...cultPosters];
                combined=combined.sort(()=> Math.random() - 0.5);

                // Remove duplicates
                combined=[...new Set(combined)];

                if (combined.length > 20) {
                    // Split into 4 unique columns
                    const chunkSize=Math.floor(combined.length / 4);
                    const col1=combined.slice(0, chunkSize);
                    const col2=combined.slice(chunkSize, chunkSize * 2);
                    const col3=combined.slice(chunkSize * 2, chunkSize * 3);
                    const col4=combined.slice(chunkSize * 3);

                    createTrack(col1, 50, 'up', imgBase);
                    createTrack(col2, 70, 'down', imgBase);
                    createTrack(col3, 55, 'up', imgBase);
                    createTrack(col4, 65, 'down', imgBase);
                }

                else {
                    // Fallback if not enough unique data
                    const list1=trendingPosters.length ? trendingPosters: cultPosters;
                    createTrack(list1, 50, 'up', imgBase);
                    createTrack(list1, 60, 'down', imgBase);
                    createTrack(list1, 55, 'up', imgBase);
                    createTrack(list1, 65, 'down', imgBase);
                }
            }

            catch (e) {
                console.error("Animation load failed", e);
            }
        }

        function createTrack(images, speed, dir, imgBase) {
            const container=document.getElementById('waterfallContainer');
            const track=document.createElement('div');

            track.className=`poster-track scrolling-$ {
                dir
            }

            `;

            track.style.animationDuration=`$ {
                speed
            }

            s`;

            // Loop twice for smooth scroll
            const loopImages=[...images,
            ...images];

            loopImages.forEach(path=> {
                    const img=document.createElement('img');

                    img.src=`$ {
                        imgBase
                    }

                    $ {
                        path
                    }

                    `;
                    img.className='track-poster';
                    img.loading='lazy';
                    track.appendChild(img);
                });

            container.appendChild(track);
        }

        initWaterfall();

        </script></body></html>
