<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OurShow</title>
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="themes.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            text-align: center;
        }

        .social-btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: white;
            color: #333;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 1.5rem;
        }

        .social-btn:hover {
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        .divider span {
            padding: 0 10px;
        }

        .demo-note {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="glass-panel login-box">
            <h1 class="logo" style="font-size: 2.5rem; margin-bottom: 0.5rem;">OurShow</h1>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">Welcome back, movie buff!</p>

            <button class="social-btn" onclick="handleGoogleLogin()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google">
                Continue with Google
            </button>

            <div class="divider"><span>OR</span></div>

            <form onsubmit="handleEmailLogin(event)">
                <div style="margin-bottom: 1rem;">
                    <input type="email" id="emailInput" class="glass-input" placeholder="Email Address" required>
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <input type="password" id="passwordInput" class="glass-input" placeholder="Password" required>
                </div>
                <button type="submit" class="glass-button"
                    style="width: 100%; background: var(--primary-color); border: none;">
                    Log In
                </button>
            </form>

            <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
                Don't have an account? <a href="#" style="color: var(--primary-color);">Sign up</a>
            </p>
            <p style="margin-top: 1rem; font-size: 0.9rem;">
                <a href="index.html" style="color: var(--text-secondary);">Continue as Guest</a>
            </p>

            <div class="demo-note">
                <strong>📝 Demo Mode:</strong><br>
                For testing, use any email/password or click Google login.<br>
                <small>Full Firebase OAuth requires running on a local server (Live Server, etc.)</small>
            </div>
        </div>
    </div>

    <script>
        // Simple login handler that works without server
        // For full Firebase OAuth, run on a local server (Live Server, http-server, etc.)

        window.handleGoogleLogin = async () => {
            // Simulate Google login for demo
            const demoUser = {
                email: 'demo@ourshow.com',
                name: 'Demo User',
                photo: 'https://ui-avatars.com/api/?name=Demo+User&background=7c3aed&color=fff'
            };

            // Store user info
            localStorage.setItem('userEmail', demoUser.email);
            localStorage.setItem('userName', demoUser.name);
            localStorage.setItem('userPhoto', demoUser.photo);
            localStorage.setItem('userId', 'demo-user-id');
            localStorage.setItem('isLoggedIn', 'true');

            alert('✅ Logged in as Demo User!\n\nNote: For real Google OAuth, please run the site on a local server (Live Server in VS Code).');
            window.location.href = 'index.html';
        };

        window.handleEmailLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;

            if (email && password) {
                // Extract name from email
                const name = email.split('@')[0].replace(/[._-]/g, ' ');
                const capitalizedName = name.split(' ').map(word =>
                    word.charAt(0).toUpperCase() + word.slice(1)
                ).join(' ');

                // Store user info
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userName', capitalizedName);
                localStorage.setItem('userPhoto', `https://ui-avatars.com/api/?name=${encodeURIComponent(capitalizedName)}&background=7c3aed&color=fff`);
                localStorage.setItem('userId', 'user-' + Date.now());
                localStorage.setItem('isLoggedIn', 'true');

                alert(`✅ Logged in as ${capitalizedName}!`);
                window.location.href = 'index.html';
            }
        };

        // Check if already logged in
        if (localStorage.getItem('isLoggedIn') === 'true') {
            const userName = localStorage.getItem('userName');
            if (confirm(`You're already logged in as ${userName}. Go to homepage?`)) {
                window.location.href = 'index.html';
            }
        }
    </script>

</body>

</html>
