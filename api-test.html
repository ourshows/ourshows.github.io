<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - OurShow</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }

        .test-section {
            background: #16213e;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border: 1px solid #0f3460;
        }

        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }

        button:hover {
            background: #6d28d9;
        }

        .result {
            margin-top: 15px;
            padding: 15px;
            background: #0f3460;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 14px;
        }

        .success {
            color: #10b981;
        }

        .error {
            color: #ef4444;
        }

        .loading {
            color: #f59e0b;
        }

        h1 {
            color: #7c3aed;
        }

        h2 {
            color: #db2777;
        }
    </style>
</head>

<body>
    <h1>🧪 API Test Suite</h1>
    <p>This page tests your Groq AI and TMDB API configurations.</p>

    <!-- Config Check -->
    <div class="test-section">
        <h2>1. Configuration Check</h2>
        <button onclick="checkConfig()">Check Config</button>
        <div id="configResult" class="result"></div>
    </div>

    <!-- Groq AI Test -->
    <div class="test-section">
        <h2>2. Groq AI API Test</h2>
        <button onclick="testGroq()">Test Groq AI</button>
        <div id="hfResult" class="result"></div>
    </div>

    <!-- TMDB Test -->
    <div class="test-section">
        <h2>3. TMDB API Test</h2>
        <button onclick="testTMDB()">Test TMDB</button>
        <div id="tmdbResult" class="result"></div>
    </div>

    <!-- Full Integration Test -->
    <div class="test-section">
        <h2>4. Full Integration Test</h2>
        <button onclick="testFullIntegration()">Test Movie Recommendation</button>
        <div id="integrationResult" class="result"></div>
    </div>

    <script src="public-config.js"></script>
    <script src="config.js"></script>
    <script>
        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'loading';
            element.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
        }

        function clearLog(elementId) {
            document.getElementById(elementId).innerHTML = '';
        }

        // 1. Check Config
        function checkConfig() {
            clearLog('configResult');
            log('configResult', 'Checking configuration...', 'loading');

            if (!window.APP_CONFIG) {
                log('configResult', '⚠️ APP_CONFIG not found, but API keys are now server-side.', 'info');
                return;
            }

            log('configResult', '✅ APP_CONFIG found (Proxied Mode)', 'success');
            log('configResult', 'API Keys should be configured in Firebase Functions.', 'info');
        }

        // 2. Test Groq API
        async function testGroq() {
            clearLog('hfResult');
            log('hfResult', 'Testing Groq API...', 'loading');

            let url = '/api/ai';
            if (window.PUBLIC_CONFIG?.API_BASE_URL) {
                url = `${window.PUBLIC_CONFIG.API_BASE_URL}/aiProxy`;
                log('hfResult', '☁️ Using Public Cloud Proxy', 'info');
            }

            log('hfResult', `URL: ${url}`, 'info');
            log('hfResult', 'Sending request...', 'loading');

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: [
                            { role: "user", content: "Say hello in one sentence." }
                        ]
                    })
                });

                log('hfResult', `Response Status: ${response.status} ${response.statusText}`,
                    response.ok ? 'success' : 'error');

                const data = await response.json();
                log('hfResult', '\nResponse Data:', 'info');
                log('hfResult', JSON.stringify(data, null, 2), 'info');

                if (response.ok) {
                    if (data.reply) {
                        log('hfResult', '\n✅ SUCCESS! AI Response:', 'success');
                        log('hfResult', data.reply, 'success');
                    } else {
                        log('hfResult', '\n⚠️ Unexpected response format', 'error');
                    }
                } else {
                    log('hfResult', '\n❌ API Error: ' + (data.error || 'Unknown error'), 'error');
                }

            } catch (error) {
                log('hfResult', `\n❌ Network Error: ${error.message}`, 'error');
                log('hfResult', 'Check your internet connection', 'error');
            }
        }

        // 3. Test TMDB API
        async function testTMDB() {
            clearLog('tmdbResult');
            log('tmdbResult', 'Testing TMDB API...', 'loading');

            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            let url;

            if (isLocal && window.APP_CONFIG && window.APP_CONFIG.TMDB_API_KEY) {
                log('tmdbResult', '🏠 Localhost detected: Using Direct API Key', 'info');
                const baseUrl = window.APP_CONFIG.TMDB_BASE_URL || "https://api.themoviedb.org/3";
                url = new URL(`${baseUrl}/search/movie`);
                url.searchParams.append('api_key', window.APP_CONFIG.TMDB_API_KEY);
                url.searchParams.append('query', 'Inception');
            } else if (window.PUBLIC_CONFIG?.API_BASE_URL) {
                log('tmdbResult', '☁️ Production Config Detected: Using Public Cloud Proxy', 'info');
                url = new URL(`${window.PUBLIC_CONFIG.API_BASE_URL}/tmdbProxy`);
                url.searchParams.append('endpoint', '/search/movie');
                url.searchParams.append('query', 'Inception');
            } else {
                log('tmdbResult', '⚠️ No Config found, attempting relative proxy...', 'info');
                url = new URL('/api/tmdb', window.location.origin);
                url.searchParams.append('endpoint', '/search/movie');
                url.searchParams.append('query', 'Inception');
            }

            log('tmdbResult', `Request URL: ${url}`, 'info');

            try {
                const response = await fetch(url);

                log('tmdbResult', `Response Status: ${response.status} ${response.statusText}`,
                    response.ok ? 'success' : 'error');

                const data = await response.json();

                if (response.ok) {
                    log('tmdbResult', `\n✅ SUCCESS! Found ${data.results.length} results`, 'success');

                    if (data.results[0]) {
                        const movie = data.results[0];
                        log('tmdbResult', `\nFirst Result:`, 'info');
                        log('tmdbResult', `Title: ${movie.title}`, 'info');
                        log('tmdbResult', `Year: ${movie.release_date?.substring(0, 4)}`, 'info');
                        log('tmdbResult', `Rating: ${movie.vote_average}/10`, 'info');
                    }
                } else {
                    log('tmdbResult', '\n❌ API Error:', 'error');
                    log('tmdbResult', JSON.stringify(data, null, 2), 'error');
                }

            } catch (error) {
                log('tmdbResult', `\n❌ Network Error: ${error.message}`, 'error');
            }
        }

        // 4. Full Integration Test
        async function testFullIntegration() {
            clearLog('integrationResult');
            log('integrationResult', 'Testing full AI + TMDB integration...', 'loading');

            if (!window.APP_CONFIG) {
                log('integrationResult', '⚠️ Starting integration test...', 'info');
            }

            // Step 1: Get AI recommendation
            log('integrationResult', '\nStep 1: Asking AI for movie recommendations...', 'loading');

            const prompt = `You are a movie expert. Recommend 3 action movies. Return ONLY JSON.`;

            try {
                const hfResponse = await fetch('/api/ai', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: "You are a movie expert. Return ONLY JSON format: { \"recommendations\": [{\"title\": \"Movie Title\", \"year\": \"2020\", \"reason\": \"Why it's good\"}] }" },
                            { role: "user", content: "Recommend 3 action movies." }
                        ],
                        jsonMode: true
                    })
                });

                if (!hfResponse.ok) {
                    const error = await hfResponse.json();
                    log('integrationResult', `❌ Groq Error: ${error.error || 'Unknown'}`, 'error');
                    return;
                }

                const hfData = await hfResponse.json();
                const aiText = hfData.reply || '';

                log('integrationResult', '✅ AI Response received', 'success');
                log('integrationResult', `Raw response: ${aiText.substring(0, 200)}...`, 'info');

                // Step 2: Parse JSON
                log('integrationResult', '\nStep 2: Parsing AI response...', 'loading');

                let recommendations;
                try {
                    const cleaned = aiText.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                    const jsonMatch = cleaned.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        const parsed = JSON.parse(jsonMatch[0]);
                        recommendations = parsed.recommendations;
                        log('integrationResult', `✅ Parsed ${recommendations.length} recommendations`, 'success');
                    } else {
                        log('integrationResult', '❌ No JSON found in response', 'error');
                        return;
                    }
                } catch (e) {
                    log('integrationResult', `❌ JSON Parse Error: ${e.message}`, 'error');
                    return;
                }

                // Step 3: Search TMDB for each movie
                log('integrationResult', '\nStep 3: Searching TMDB for movies...', 'loading');

                for (const rec of recommendations) {
                    const tmdbUrl = new URL('/api/tmdb', window.location.origin);
                    tmdbUrl.searchParams.append('endpoint', '/search/movie');
                    tmdbUrl.searchParams.append('query', rec.title);

                    try {
                        const tmdbResponse = await fetch(tmdbUrl);
                        const tmdbData = await tmdbResponse.json();

                        if (tmdbData.results && tmdbData.results[0]) {
                            log('integrationResult', `✅ ${rec.title} - Found on TMDB`, 'success');
                        } else {
                            log('integrationResult', `⚠️ ${rec.title} - Not found on TMDB`, 'error');
                        }
                    } catch (e) {
                        log('integrationResult', `❌ ${rec.title} - TMDB Error: ${e.message}`, 'error');
                    }
                }

                log('integrationResult', '\n✅ INTEGRATION TEST COMPLETE!', 'success');

            } catch (error) {
                log('integrationResult', `\n❌ Integration Error: ${error.message}`, 'error');
            }
        }

        // Auto-run config check on load
        window.addEventListener('load', () => {
            setTimeout(checkConfig, 500);
        });
    </script>
</body>

</html>
