<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover - OurShow</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="themes.css">
    <style>
        /* Info Loader Styles (Critical Path) */
        #globalLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.5s ease-out, visibility 0.5s;
            overflow: hidden;
        }

        #globalLoader::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vmax;
            height: 150vmax;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.08) 0%, transparent 60%);
            animation: pulseGradient 8s ease-in-out infinite;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .loader-text-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            position: relative;
            z-index: 10;
        }

        .loader-brand {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #7c3aed, #a855f7, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            opacity: 0;
            animation: loaderFadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            letter-spacing: -2px;
            margin-bottom: 0.5rem;
        }

        .loader-tags {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .loader-tag {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            color: #94a3b8;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0;
            animation: loaderFadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes loaderFadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes pulseGradient {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0.8;
            }
        }

        @media (max-width: 480px) {
            .loader-brand {
                font-size: 3rem;
                letter-spacing: -1px;
            }

            .loader-tags {
                flex-direction: column;
                gap: 0.8rem;
            }

            .loader-tag {
                font-size: 1rem;
                letter-spacing: 2px;
            }
        }
    </style>
    <script>
        window.ourShowLoader = {
            show: function () {
                const l = document.getElementById('globalLoader');
                if (l) { l.style.opacity = '1'; l.style.visibility = 'visible'; }
            },
            hide: function () {
                const l = document.getElementById('globalLoader');
                if (l) {
                    l.style.opacity = '0';
                    setTimeout(() => l.style.visibility = 'hidden', 500);
                }
            }
        };
        setTimeout(() => {
            const l = document.getElementById('globalLoader');
            if (l && getComputedStyle(l).visibility !== 'hidden' && getComputedStyle(l).opacity !== '0') {
                console.warn("Loader safety timeout");
                window.ourShowLoader.hide();
            }
        }, 8000);
    </script>
    <style>
        /* Updated Discover Layout - Stacked Filters */
        .discover-container {
            padding: 2rem 5%;
            padding-top: 100px;
            /* More space for fixed navbar */
        }

        .filter-stack {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .filter-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            /* Allow buttons to wrap on small screens */
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            /* Subtle separator */
        }

        .filter-label {
            min-width: 80px;
            /* Fixed width for alignment */
            font-weight: 700;
            color: var(--accent-color);
            /* Highlight label */
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-options {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-secondary);
            padding: 0.4rem 1.2rem;
            border-radius: 6px;
            /* slightly squarer for lists */
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .filter-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .filter-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            font-weight: 600;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.4);
        }

        #discoverGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 2rem;
        }

        /* Mobile tweaks */
        @media (max-width: 768px) {
            .filter-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .filter-label {
                margin-bottom: 0.2rem;
                opacity: 0.7;
            }
        }

        .loading-sentinel {
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 2rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="globalLoader">
        <div class="loader-text-container">
            <div class="loader-brand">OurShow</div>
            <div class="loader-tags">
                <span class="loader-tag" style="animation-delay: 0.2s;">Discover</span>
                <span class="loader-tag" style="animation-delay: 0.4s;">Discuss</span>
                <span class="loader-tag" style="animation-delay: 0.6s;">Recommend</span>
            </div>
        </div>
    </div>

    <!-- Navbar Placeholder (Copied from index.html structure) -->
    <!-- Full Navbar (Synced with index.html) -->
    <nav class="navbar" id="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">OurShow</a>

            <div class="nav-right" id="navRight">
                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="discover.html" class="nav-link active"><i class="fas fa-compass"></i> Discover</a></li>
                    <li><a href="news.html" class="nav-link"><i class="fas fa-newspaper"></i> News</a></li>
                    <li><a href="collection.html" class="nav-link"><i class="fas fa-bookmark"></i> Collections</a></li>
                    <li><a href="watchlater.html" class="nav-link"><i class="fas fa-list"></i> Watchlist</a></li>
                    <li><a href="communitychat.html" class="nav-link"><i class="fas fa-comments"></i> Chat</a></li>
                    <li><a href="ai.html" class="nav-link"><i class="fas fa-robot"></i> AI Assistant</a></li>
                </ul>

                <div class="nav-actions">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Search..." id="searchInput">
                        <div class="search-results" id="searchResults"></div>
                    </div>

                    <button class="icon-btn theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                        <i class="fas fa-moon"></i>
                    </button>

                    <a href="login.html" class="auth-btn" id="navAuthBtn">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </a>
                </div>
            </div>

            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <div class="discover-container">
        <h1 style="margin-bottom: 2rem;">Explore Content</h1>

        <!-- Filter Stack (Vertical Layout) -->
        <div class="filter-stack">

            <!-- 1. Genre -->
            <div class="filter-row">
                <span class="filter-label">Genre</span>
                <div class="filter-options">
                    <button class="filter-btn active" data-filter="genre" data-value="All">All</button>
                    <button class="filter-btn" data-filter="genre" data-value="Action">Action</button>
                    <button class="filter-btn" data-filter="genre" data-value="Comedy">Comedy</button>
                    <button class="filter-btn" data-filter="genre" data-value="Drama">Drama</button>
                    <button class="filter-btn" data-filter="genre" data-value="Sci-Fi">Sci-Fi</button>
                    <button class="filter-btn" data-filter="genre" data-value="Thriller">Thriller</button>
                </div>
            </div>

            <!-- 2. Language -->
            <div class="filter-row">
                <span class="filter-label">Language</span>
                <div class="filter-options">
                    <button class="filter-btn active" data-filter="language" data-value="All">All</button>
                    <button class="filter-btn" data-filter="language" data-value="Hindi">Hindi</button>
                    <button class="filter-btn" data-filter="language" data-value="English">English</button>
                    <button class="filter-btn" data-filter="language" data-value="Nepali">Nepali</button>
                    <button class="filter-btn" data-filter="language" data-value="Korean">Korean</button>
                    <button class="filter-btn" data-filter="language" data-value="Chinese">Chinese</button>
                </div>
            </div>

            <!-- 3. Year -->
            <div class="filter-row">
                <span class="filter-label">Year</span>
                <div class="filter-options">
                    <button class="filter-btn active" data-filter="year" data-value="All">All</button>
                    <button class="filter-btn" data-filter="year" data-value="2025">2025</button>
                    <button class="filter-btn" data-filter="year" data-value="2024">2024</button>
                    <button class="filter-btn" data-filter="year" data-value="2023">2023</button>
                </div>
            </div>

            <!-- 4. Type (Bottom) -->
            <div class="filter-row">
                <span class="filter-label">Type</span>
                <div class="filter-options">
                    <button class="filter-btn active" data-filter="type" data-value="All">All</button>
                    <button class="filter-btn" data-filter="type" data-value="TV">TV Shows</button>
                    <button class="filter-btn" data-filter="type" data-value="Movie">Movies</button>
                </div>
            </div>

        </div>

        <!-- Main Grid -->
        <div id="discoverGrid">
            <!-- Items appended here -->
        </div>

        <!-- Loading Sentinel -->
        <div class="loading-sentinel" id="sentinel">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Movie Details Modal -->
    <div id="movieModal" class="modal" style="display: none;">
        <div class="modal-content glass-panel">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-body">
                <div class="modal-poster-container">
                    <img id="modalPoster" src="" alt="Movie Poster" class="modal-poster">
                    <!-- Verdict Meter (PC Only) -->
                    <div id="pcVerdictMeter" class="verdict-meter-container pc-only"></div>
                </div>
                <div class="modal-info">
                    <!-- Modal Header -->
                    <h2 id="modalTitle" style="margin-bottom: 1rem;">Movie Title</h2>
                    <div style="display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
                        <span style="color: #ffd700;">★ <span id="modalRating">N/A</span></span>
                        <span id="modalYear">Year</span>
                        <span id="modalRuntime">Runtime</span>
                    </div>

                    <!-- Tab Navigation -->
                    <div class="modal-tabs"
                        style="display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem;">
                        <button class="tab-btn active" onclick="switchTab('overview')">Overview</button>
                        <button class="tab-btn" onclick="switchTab('cast')">Cast & Crew</button>
                        <button class="tab-btn" onclick="switchTab('reviews')">Reviews</button>
                        <button class="tab-btn" onclick="switchTab('similar')">Similar</button>
                        <button class="tab-btn" onclick="switchTab('ai')">Ask AI</button>
                    </div>

                    <!-- Action Buttons -->
                    <button class="glass-button primary" onclick="watchNow()"><i class="fas fa-play"></i> Watch
                        Now</button>
                    <button id="modalWatchLaterBtn" class="glass-button" onclick="addToWatchLater()"><i
                            class="fas fa-plus"></i> My
                        List</button>
                    <button class="glass-button" onclick="openAddToCollectionModal()"><i class="fas fa-folder-plus"></i>
                        Collection</button>
                    <button id="modalWatchedBtn" class="glass-button" onclick="markAsWatched()"><i
                            class="fas fa-check"></i> Mark
                        Watched</button>
                    <!-- Overview Tab -->
                    <div id="tab-overview" class="tab-content active">
                        <p id="modalOverview" class="modal-overview">Overview text...</p>
                        <div id="modalGenres" style="margin-top: 1rem;"></div>
                        <div id="modalTrailer" style="margin-top: 2rem;"></div>
                        <!-- Verdict Meter (Mobile Only) -->
                        <div id="mobileVerdictMeter" class="verdict-meter-container mobile-only"
                            style="margin-top: 2rem;"></div>
                    </div>

                    <!-- Cast Tab -->
                    <div id="tab-cast" class="tab-content">
                        <div class="cast-grid" id="modalCast"></div>
                    </div>

                    <!-- Reviews Tab -->
                    <div id="tab-reviews" class="tab-content">
                        <div id="modalReviews"></div>
                        <div class="add-review-section"
                            style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--glass-border);">
                            <h3>Add Your Review</h3>
                            <div class="rating-select"
                                style="margin: 1rem 0; display: flex; gap: 0.5rem; flex-wrap: wrap;">
                                <button class="rating-btn" onclick="rateMovie('Pass')" data-rating="Pass">Pass
                                    🔴</button>
                                <button class="rating-btn" onclick="rateMovie('One time watch')"
                                    data-rating="One time watch">One time watch 🟠</button>
                                <button class="rating-btn" onclick="rateMovie('Go for it')" data-rating="Go for it">Go
                                    for it 🟢</button>
                                <button class="rating-btn" onclick="rateMovie('Perfection')"
                                    data-rating="Perfection">Perfection 🌟</button>
                            </div>
                            <textarea id="reviewText" class="glass-input" rows="3"
                                placeholder="Write your review..."></textarea>
                            <button class="glass-button" onclick="submitReview()" style="margin-top: 1rem;">Submit
                                Review</button>
                        </div>
                    </div>

                    <!-- Similar Tab -->
                    <div id="tab-similar" class="tab-content">
                        <h3>Similar Movies</h3>
                        <div class="similar-grid" id="modalSimilar"></div>
                    </div>

                    <!-- AI Tab -->
                    <div id="tab-ai" class="tab-content">
                        <h3>Ask AI</h3>
                        <div class="ai-chat-container" id="aiChat"
                            style="min-height: 300px; max-height: 400px; overflow-y: auto; margin-bottom: 1rem; padding: 1rem; background: rgba(0, 0, 0, 0.2); border-radius: 12px;">
                        </div>
                        <div class="ai-input-group" style="display: flex; gap: 1rem;">
                            <input type="text" id="aiQuestion" class="glass-input" placeholder="Ask about this movie..."
                                style="flex: 1; padding: 0.75rem; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-primary);">
                            <button class="glass-button" onclick="askAI()">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <link rel="stylesheet" href="public/modal.css">

        <script src="public-config.js"></script>
        <script src="auth.js"></script>
        <script type="module" src="ai.js"></script>
        <script type="module" src="main.js"></script>
        <script type="module" src="discover.js"></script>
        <script src="public/mobile-nav.js"></script>
</body>

</html>
