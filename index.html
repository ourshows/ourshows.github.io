<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OurShow - Discover & Watch</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">OurShow</a>

            <div class="search-container">
                <input type="text" id="searchInput" class="glass-input" placeholder="Search movies, series, vibes...">
                <div id="searchResults" class="search-results glass-panel"></div>
            </div>

            <ul class="nav-links">
                <li><a href="index.html" class="nav-link active"><i class="fas fa-home"></i> <span>Home</span></a></li>
                <li><a href="ai.html" class="nav-link"><i class="fas fa-robot"></i> <span>AI Vibe</span></a></li>
                <li><a href="communitychat.html" class="nav-link"><i class="fas fa-comments"></i> <span>Chat</span></a>
                </li>
                <li><a href="post.html" class="nav-link"><i class="fas fa-users"></i> <span>Feed</span></a></li>
                <li><a href="watchanddownload.html" class="nav-link"><i class="fas fa-download"></i>
                        <span>Download</span></a></li>
                <li><a href="profile.html" class="nav-link"><i class="fas fa-user"></i> <span>Profile</span></a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero" id="heroSection">
        <div class="hero-bg-container">
            <img id="heroBg" class="hero-bg" src="" alt="">
        </div>
        <div class="container hero-content">
            <div class="hero-meta">
                <span class="rating-badge" id="heroRating">--</span>
                <span id="heroYear">----</span>
                <span id="heroGenres">Genre</span>
            </div>
            <h1 class="hero-title" id="heroTitle">Loading...</h1>
            <p class="hero-desc" id="heroOverview">Discover the best movies and series tailored just for you.</p>
            <div class="hero-actions" style="margin-top: 2rem; display: flex; gap: 1rem;">
                <button class="glass-button" id="heroWatchBtn" style="background: var(--primary-color); border: none;">
                    <i class="fas fa-play"></i> Watch Now
                </button>
                <button class="glass-button" id="heroListBtn">
                    <i class="fas fa-plus"></i> My List
                </button>
                <a href="app/PP_Cine.apk" download class="glass-button">
                    <i class="fas fa-download"></i> Download App
                </a>
            </div>
        </div>
    </header>

    <div class="media-card skeleton"></div>
    <div class="media-card skeleton"></div>
    <div class="media-card skeleton"></div>
    </div>
    </section>

    <!-- Top Rated -->
    <section class="content-section" style="margin-top: 3rem;">
        <h2 class="section-title">Top Rated</h2>
        <div class="media-scroller" id="topRatedScroller">
            <div class="media-card skeleton"></div>
            <div class="media-card skeleton"></div>
            <div class="media-card skeleton"></div>
            <div class="media-card skeleton"></div>
            <div class="media-card skeleton"></div>
        </div>
    </section>

    <!-- Upcoming -->
    <section class="content-section" style="margin-top: 3rem;">
        <h2 class="section-title">Coming Soon</h2>
        <div class="media-scroller" id="upcomingScroller">
            <div class="media-card skeleton"></div>
            <div class="media-card skeleton"></div>

            </main>

            <!-- Movie Details Modal -->
            <div id="movieModal" class="modal" style="display: none;">
                <div class="modal-content glass-panel">
                    <span class="modal-close" onclick="closeModal()">&times;</span>

                    <div class="modal-header">
                        <img id="modalPoster" src="" alt="Poster" class="modal-poster">
                        <div class="modal-header-info">
                            <h2 id="modalTitle"></h2>
                            <div class="modal-meta">
                                <span class="rating-badge" id="modalRating"></span>
                                <span id="modalYear"></span>
                                <span id="modalRuntime"></span>
                            </div>
                            <p id="modalOverview"></p>

                            <!-- Action Buttons -->
                            <div class="modal-actions">
                                <button class="glass-button" onclick="markAsWatched()"><i class="fas fa-check"></i>
                                    Watched</button>
                                <button class="glass-button" onclick="addToWatchLater()"><i class="fas fa-clock"></i>
                                    Watch
                                    Later</button>
                                <button class="glass-button" onclick="watchNow()"><i class="fas fa-play"></i> Watch
                                    Now</button>
                            </div>
                        </div>
                    </div>

                    <!-- Tabs -->
                    <div class="modal-tabs">
                        <button class="tab-btn active" onclick="switchTab('overview')">Overview</button>
                        <button class="tab-btn" onclick="switchTab('cast')">Cast & Crew</button>
                        <button class="tab-btn" onclick="switchTab('reviews')">Reviews</button>
                        <button class="tab-btn" onclick="switchTab('similar')">Similar</button>
                        <button class="tab-btn" onclick="switchTab('ai')">Ask AI</button>
                    </div>

                    <!-- Tab Content -->
                    <div class="modal-body">
                        <!-- Overview Tab -->
                        <div id="tab-overview" class="tab-content active">
                            <div id="modalTrailer"></div>
                            <div id="modalGenres"></div>

                            <!-- Rating System -->
                            <div class="rating-section">
                                <h3>Rate This Movie</h3>
                                <div class="rating-buttons">
                                    <button class="rating-btn" data-rating="1" onclick="rateMovie(1)">😞 Bad</button>
                                    <button class="rating-btn" data-rating="2" onclick="rateMovie(2)">😐 One-Time
                                        Watch</button>
                                    <button class="rating-btn" data-rating="3" onclick="rateMovie(3)">🙂 Good</button>
                                    <button class="rating-btn" data-rating="4" onclick="rateMovie(4)">😃 Must
                                        Watch</button>
                                    <button class="rating-btn" data-rating="5" onclick="rateMovie(5)">🤩
                                        Perfection</button>
                                </div>
                                <textarea id="reviewText" class="glass-input" placeholder="Write your review..."
                                    rows="4"></textarea>
                                <button class="glass-button" onclick="submitReview()">Submit Review</button>
                            </div>
                        </div>

                        <!-- Cast Tab -->
                        <div id="tab-cast" class="tab-content" style="display: none;">
                            <h3>Cast</h3>
                            <div id="modalCast" class="cast-grid"></div>
                        </div>

                        <!-- Reviews Tab -->
                        <div id="tab-reviews" class="tab-content" style="display: none;">
                            <h3>User Reviews</h3>
                            <div id="modalReviews"></div>
                        </div>

                        <!-- Similar Tab -->
                        <div id="tab-similar" class="tab-content" style="display: none;">
                            <h3>Similar Titles</h3>
                            <div id="modalSimilar" class="media-scroller"></div>
                        </div>

                        <!-- AI Chat Tab -->
                        <div id="tab-ai" class="tab-content" style="display: none;">
                            <h3>Ask AI About This Movie</h3>
                            <div id="aiChat" class="ai-chat-container"></div>
                            <div class="ai-input-group">
                                <input type="text" id="aiQuestion" class="glass-input"
                                    placeholder="Ask about facts, trivia, spoilers...">
                                <button class="glass-button" onclick="askAI()"><i class="fas fa-paper-plane"></i>
                                    Ask</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <style>
                .modal {
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.9);
                    z-index: 10000;
                    overflow-y: auto;
                    padding: 2rem;
                }

                .modal-content {
                    max-width: 1200px;
                    margin: 0 auto;
                    position: relative;
                    padding: 2rem;
                }

                .modal-close {
                    position: absolute;
                    top: 1rem;
                    right: 1rem;
                    font-size: 2rem;
                    cursor: pointer;
                    color: white;
                    z-index: 10;
                }

                .modal-header {
                    display: flex;
                    gap: 2rem;
                    margin-bottom: 2rem;
                }

                .modal-poster {
                    width: 300px;
                    border-radius: 12px;
                }

                .modal-header-info {
                    flex: 1;
                }

                .modal-meta {
                    display: flex;
                    gap: 1rem;
                    margin: 1rem 0;
                }

                .modal-actions {
                    display: flex;
                    gap: 1rem;
                    margin-top: 1.5rem;
                    flex-wrap: wrap;
                }

                .modal-tabs {
                    display: flex;
                    gap: 1rem;
                    border-bottom: 2px solid var(--glass-border);
                    margin-bottom: 2rem;
                }

                .tab-btn {
                    background: none;
                    border: none;
                    color: var(--text-secondary);
                    padding: 1rem 1.5rem;
                    cursor: pointer;
                    font-weight: 600;
                    border-bottom: 3px solid transparent;
                    transition: all 0.3s;
                }

                .tab-btn.active {
                    color: var(--primary-color);
                    border-bottom-color: var(--primary-color);
                }

                .tab-content {
                    display: none;
                }

                .tab-content.active {
                    display: block;
                }

                .rating-section {
                    margin-top: 2rem;
                    padding: 1.5rem;
                    background: rgba(0, 0, 0, 0.3);
                    border-radius: 12px;
                }

                .rating-buttons {
                    display: flex;
                    gap: 1rem;
                    margin: 1rem 0;
                    flex-wrap: wrap;
                }

                .rating-btn {
                    flex: 1;
                    min-width: 120px;
                    padding: 1rem;
                    border: 2px solid var(--glass-border);
                    background: rgba(255, 255, 255, 0.05);
                    color: white;
                    border-radius: 8px;
                    cursor: pointer;
                    transition: all 0.3s;
                    font-size: 0.9rem;
                }

                .rating-btn:hover,
                .rating-btn.selected {
                    border-color: var(--primary-color);
                    background: var(--primary-color);
                    transform: scale(1.05);
                }

                .cast-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                    gap: 1.5rem;
                }

                .cast-card {
                    text-align: center;
                }

                .cast-card img {
                    width: 100%;
                    border-radius: 8px;
                    margin-bottom: 0.5rem;
                }

                .review-card {
                    background: rgba(255, 255, 255, 0.05);
                    padding: 1.5rem;
                    border-radius: 12px;
                    margin-bottom: 1rem;
                }

                .ai-chat-container {
                    max-height: 400px;
                    overflow-y: auto;
                    margin-bottom: 1rem;
                    padding: 1rem;
                    background: rgba(0, 0, 0, 0.3);
                    border-radius: 12px;
                }

                .ai-message {
                    margin-bottom: 1rem;
                    padding: 1rem;
                    border-radius: 8px;
                }

                .ai-message.user {
                    background: var(--primary-color);
                    margin-left: 20%;
                }

                .ai-message.ai {
                    background: rgba(255, 255, 255, 0.1);
                    margin-right: 20%;
                }

                .ai-input-group {
                    display: flex;
                    gap: 1rem;
                }

                @media (max-width: 768px) {
                    .modal-header {
                        flex-direction: column;
                    }

                    .modal-poster {
                        width: 100%;
                    }
                }
            </style>

            <!-- Scripts -->
            <script src="config.js"></script>
            <script src="main.js" type="module"></script>
</body>

</html>
