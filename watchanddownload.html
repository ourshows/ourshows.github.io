<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch - OurShow</title>
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="themes.css">
    <style>
        /* Info Loader Styles (Critical Path) */
        #globalLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.5s ease-out, visibility 0.5s;
            overflow: hidden;
        }

        #globalLoader::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vmax;
            height: 150vmax;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.08) 0%, transparent 60%);
            animation: pulseGradient 8s ease-in-out infinite;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .loader-text-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            position: relative;
            z-index: 10;
        }

        .loader-brand {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #7c3aed, #a855f7, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            opacity: 0;
            animation: loaderFadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            letter-spacing: -2px;
            margin-bottom: 0.5rem;
        }

        .loader-tags {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .loader-tag {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            color: #94a3b8;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0;
            animation: loaderFadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes loaderFadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes pulseGradient {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0.8;
            }
        }

        @media (max-width: 480px) {
            .loader-brand {
                font-size: 3rem;
                letter-spacing: -1px;
            }

            .loader-tags {
                flex-direction: column;
                gap: 0.8rem;
            }

            .loader-tag {
                font-size: 1rem;
                letter-spacing: 2px;
            }
        }
    </style>
    <script>
        window.ourShowLoader = {
            show: function () {
                const l = document.getElementById('globalLoader');
                if (l) { l.style.opacity = '1'; l.style.visibility = 'visible'; }
            },
            hide: function () {
                const l = document.getElementById('globalLoader');
                if (l) {
                    l.style.opacity = '0';
                    setTimeout(() => l.style.visibility = 'hidden', 500);
                }
            }
        };
        setTimeout(() => {
            const l = document.getElementById('globalLoader');
            if (l && getComputedStyle(l).visibility !== 'hidden' && getComputedStyle(l).opacity !== '0') {
                console.warn("Loader safety timeout");
                window.ourShowLoader.hide();
            }
        }, 8000);
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .details-header {
            position: relative;
            min-height: 60vh;
            display: flex;
            align-items: flex-end;
            padding-bottom: 4rem;
        }

        .backdrop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
            filter: brightness(0.4);
        }

        .poster-container {
            flex-shrink: 0;
            width: 300px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            margin-right: 3rem;
        }

        .poster-container img {
            width: 100%;
            display: block;
        }

        .details-content {
            flex: 1;
        }

        .tagline {
            font-style: italic;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .providers-section {
            margin-top: 2rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .provider-logo {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .custom-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            text-align: center;
            min-width: 200px;
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            border: none;
            color: white;
            padding: 1rem;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .action-btn:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        .action-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
        }

        @media (max-width: 768px) {
            .details-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .poster-container {
                margin-right: 0;
                margin-bottom: 2rem;
                width: 200px;
            }
        }
    </style>
</head>

<body>
    <div id="globalLoader">
        <div class="loader-text-container">
            <div class="loader-brand">OurShow</div>
            <div class="loader-tags">
                <span class="loader-tag" style="animation-delay: 0.2s;">Discover</span>
                <span class="loader-tag" style="animation-delay: 0.4s;">Discuss</span>
                <span class="loader-tag" style="animation-delay: 0.6s;">Recommend</span>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">OurShow</a>
            <a href="index.html" class="nav-link"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
    </nav>

    <div class="details-header container">
        <div class="backdrop-overlay" id="backdrop"></div>

        <div class="poster-container">
            <img id="poster" src="" alt="Poster">
        </div>

        <div class="details-content">
            <h1 id="title" style="font-size: 3rem; margin-bottom: 0.5rem;">Loading...</h1>
            <p id="tagline" class="tagline"></p>

            <div style="margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: center;">
                <span class="rating-badge" id="rating">--</span>
                <span id="releaseDate">----</span>
                <span id="runtime">-- min</span>
            </div>

            <p id="overview" style="line-height: 1.6; color: #cbd5e1; margin-bottom: 2rem;"></p>

            <!-- Streaming Options Section -->
            <div class="custom-actions">
                <h3 style="margin-bottom: 1.5rem; font-size: 1.3rem; color: #fff; font-weight: 700;">
                    <i class="fas fa-play-circle" style="color: var(--primary-color);"></i> Stream & Download
                </h3>

                <!-- Mobile App (Mobile Only) - Recommended -->
                <div class="mobile-only-section" style="display: none; margin-bottom: 2rem;">
                    <h4 style="font-size: 1rem; color: #94a3b8; margin-bottom: 1rem; font-weight: 500;">
                        <i class="fas fa-mobile-alt"></i> Recommended App
                    </h4>
                    <div style="display: grid; grid-template-columns: 1fr; gap: 0.75rem;">
                        <a href="app/PP_Cine.apk" download class="action-btn" id="btnApp"
                            style="background: linear-gradient(135deg, #10b981, #059669); padding: 1rem; border-radius: 10px;">
                            <i class="fas fa-download"></i> Download PP Cine App
                            <div style="font-size: 0.7rem; opacity: 0.85; margin-top: 0.3rem;">Best for Mobile (Free
                                APK)</div>
                        </a>
                    </div>
                </div>

                <!-- Dynamic Streaming Links Container -->
                <div id="dynamicLinksContainer" style="margin-bottom: 2rem; min-height: 100px;">
                    <!-- Links will be injected here by watchanddownload.js -->
                    <div style="text-align: center; color: #64748b; padding: 2rem;">
                        <i class="fas fa-circle-notch fa-spin"></i> Loading options...
                    </div>
                </div>

                <style>
                    @media (max-width: 768px) {
                        .mobile-only-section {
                            display: block !important;
                        }

                        .custom-actions h3 {
                            font-size: 1.1rem !important;
                        }

                        .custom-actions h4 {
                            font-size: 0.9rem !important;
                        }
                    }
                </style>

                <p
                    style="margin-top: 1.5rem; font-size: 0.85rem; color: #64748b; text-align: center; line-height: 1.5;">
                    <i class="fas fa-info-circle"></i> Choose a platform above to watch or download this content
                </p>
            </div>

            <!-- Official Providers -->
            <div class="providers-section" id="providersSection" style="display: none;">
                <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">Official Streaming Partners</h3>
                <div id="providersList"></div>
            </div>
        </div>
    </div>

    <script src="public-config.js"></script>

    <script src="watchanddownload.js"></script>
</body>

</html>
