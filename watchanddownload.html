<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch - OurShow</title>
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="public/themes.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .details-header {
            position: relative;
            min-height: 60vh;
            display: flex;
            align-items: flex-end;
            padding-bottom: 4rem;
        }

        .backdrop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
            filter: brightness(0.4);
        }

        .poster-container {
            flex-shrink: 0;
            width: 300px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            margin-right: 3rem;
        }

        .poster-container img {
            width: 100%;
            display: block;
        }

        .details-content {
            flex: 1;
        }

        .tagline {
            font-style: italic;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .providers-section {
            margin-top: 2rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .provider-logo {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .custom-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            text-align: center;
            min-width: 200px;
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            border: none;
            color: white;
            padding: 1rem;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .action-btn:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        .action-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
        }

        @media (max-width: 768px) {
            .details-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .poster-container {
                margin-right: 0;
                margin-bottom: 2rem;
                width: 200px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">OurShow</a>
            <a href="index.html" class="nav-link"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
    </nav>

    <div class="details-header container">
        <div class="backdrop-overlay" id="backdrop"></div>

        <div class="poster-container">
            <img id="poster" src="" alt="Poster">
        </div>

        <div class="details-content">
            <h1 id="title" style="font-size: 3rem; margin-bottom: 0.5rem;">Loading...</h1>
            <p id="tagline" class="tagline"></p>

            <div style="margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: center;">
                <span class="rating-badge" id="rating">--</span>
                <span id="releaseDate">----</span>
                <span id="runtime">-- min</span>
            </div>

            <p id="overview" style="line-height: 1.6; color: #cbd5e1; margin-bottom: 2rem;"></p>

            <!-- Custom Watch Actions -->
            <div class="custom-actions">
                <button class="action-btn" id="btnApp">
                    <i class="fas fa-mobile-alt"></i> Download PP_Cine App (Free)
                </button>
                <a href="#" class="action-btn secondary" id="btnWeb">
                    <i class="fas fa-globe"></i> Watch on Net2025.cc (Free)
                </a>
            </div>

            <!-- Official Providers -->
            <div class="providers-section" id="providersSection" style="display: none;">
                <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">Official Streaming Partners</h3>
                <div id="providersList"></div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="watchanddownload.js"></script>
</body>

</html>
